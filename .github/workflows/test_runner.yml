name: QA Automation Suite

# Trigger on manual dispatch only
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Python environment
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # 3. Install Python Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install Allure for reporting
        pip install allure-pytest

    # 4. Install Playwright Browsers
    - name: Install Playwright Browsers
      run: |
        playwright install chromium
        playwright install-deps

    # 5. Run Tests
    # Note: Only running API tests (test_sync_login.py) in CI
    # UI tests (test_ui_scenarios.py, test_manual_login.py) require authenticated session
    # and should be run locally with saved authentication
    - name: Run Tests
      env:
        CI: true
        HEADLESS: true
        TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
        TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
        TRELLO_USER_EMAIL: ${{ secrets.TRELLO_USER_EMAIL }}
        TRELLO_USER_PASSWORD: ${{ secrets.TRELLO_USER_PASSWORD }}
      run: |
        pytest tests/test_sync_login.py -v --alluredir=allure-results --log-cli-level=INFO

    # 6. Generate Allure Report (if Allure is installed)
    - name: Generate Allure Report
      if: always()
      run: |
        # Install Allure command-line tool
        wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
        tar -zxvf allure-2.24.1.tgz
        sudo mv allure-2.24.1 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure
        # Generate the report
        allure generate allure-results --clean -o allure-report

    # 7. Upload Allure Report as Artifact
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    # 8. Upload Test Results
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: allure-results/
        retention-days: 30
